<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="输入率土之滨藏宝阁链接，查看账号武将红度、战法研究进度、宝物及未拥有项。"><title>藏宝阁账号图鉴 · 智能工具小站</title><link rel="stylesheet" href="account.css?v=20261013-star-count-v1"></head>
<body><header><div class="wrap"><a class="home" href="./">← 智能工具小站</a><p class="eyebrow">率土之滨 · 账号工具</p><h1>藏宝阁账号图鉴</h1><p>看看已有阵容，也看看还缺哪些武将与战法，查看账号宝物。</p></div></header>
<main class="wrap"><section class="query panel"><form id="query-form"><label for="account-url">藏宝阁商品链接</label><div class="query-row"><input id="account-url" type="url" required placeholder="https://stzb.cbg.163.com/cgi/mweb/equip/…" autocomplete="off"><button id="query-button" disabled>查询账号</button></div><label class="second-label" for="compare-url">第二个藏宝阁链接（可选，用于账号对比）</label><input id="compare-url" type="url" placeholder="输入第二个链接，对比两个账号" autocomplete="off"></form><div class="import-row"><span>已有详情数据？</span><label class="file-button">导入 JSON<input id="import-file" type="file" accept=".json,application/json"></label></div><p id="message" role="status" aria-live="polite">正在载入图鉴目录…</p></section>
<section id="account-info" class="panel" hidden><div class="account-head"><div class="account-title"><h2 id="account-status"></h2><span id="account-type" class="account-type"></span></div><button id="export-button" class="secondary">导出清单 JSON</button></div><p id="account-server"></p><p id="account-summary"></p><p id="account-time" class="muted"></p><div id="stats" class="stats"></div><div id="comparison-summary" class="comparison-summary" hidden></div></section>
<section class="collection panel"><div class="tabs" role="tablist" aria-label="图鉴分类"><button id="heroes-tab" role="tab" aria-selected="true" aria-controls="results">武将</button><button id="skills-tab" role="tab" aria-selected="false" aria-controls="results">战法</button><button id="gear-tab" role="tab" aria-selected="false" aria-controls="results">宝物</button></div><p id="catalog-note" class="muted"></p><div class="filters"><label>搜索<input id="search" type="search" placeholder="输入名称"></label><label id="ownership-filter">拥有状态<select id="ownership"><option value="all">全部</option><option value="owned">已拥有</option><option value="missing">未拥有</option></select></label><label id="country-filter">阵营<select id="country"><option value="all">全部阵营</option><option>汉</option><option>魏</option><option>蜀</option><option>吴</option><option>群</option><option>晋</option></select></label><label id="season-filter">赛季限定<select id="season"><option value="all">全部武将</option><option value="S2">S2 限定</option><option value="S3">S3 限定</option></select></label><label id="rarity-filter">星级<select id="rarity"><option value="all">全部星级</option><option value="5">五星</option><option value="4">四星</option></select></label><label id="type-filter" hidden>战法类型<select id="skill-type"><option value="all">全部类型</option><option>指挥</option><option>主动</option><option>被动</option><option>追击</option></select></label><label id="gear-quality-filter" hidden>宝物品质<select id="gear-quality"><option value="all">全部品质</option><option value="3">稀世</option><option value="2">罕俦</option><option value="1">精品</option></select></label></div><button id="differences-only" class="secondary" type="button" aria-pressed="false" hidden>只看差异</button><p id="result-count" aria-live="polite"></p><div id="results" role="tabpanel" aria-labelledby="heroes-tab" class="grid"></div><p id="empty" hidden>没有符合条件的条目，试试其他筛选条件。</p></section>
<p class="footer">率土之滨 · 藏宝阁账号图鉴</p></main><script type="module" src="account.js?v=20261013-star-count-v1"></script></body></html>
